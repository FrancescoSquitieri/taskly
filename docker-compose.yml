name: taskly

# Full Taskly stack — infra + every app container.
#
# Up:        npm run docker:up
# Up build:  npm run docker:up:build
# Down:      npm run docker:down
# Logs:      npm run docker:logs
#
# For "infra-only" development (run apps on the host), use docker-compose.infra.yml
# instead — see npm run docker:infra:up.

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://taskly:taskly@postgres:5432/taskly?schema=public
  REDIS_URL: redis://redis:6379
  SESSION_SECRET: ${SESSION_SECRET:-please-change-me-please-change-me-32+}
  SESSION_TTL_SECONDS: 604800
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
  SMTP_HOST: mailhog
  SMTP_PORT: 1025
  SMTP_FROM: no-reply@taskly.local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskly
      POSTGRES_PASSWORD: taskly
      POSTGRES_DB: taskly
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskly -d taskly']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
    entrypoint: []
    working_dir: /app/apps/api
    command:
      - /bin/sh
      - -c
      - npx prisma migrate deploy --schema=prisma/schema.prisma || npx prisma db push --schema=prisma/schema.prisma --accept-data-loss
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      PORT: 4000
    ports:
      - '4000:4000'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:4000/healthz | grep -q '"ok":true' || exit 1
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *app-env

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      PORT: 4001
      USE_SOCKET_REDIS_ADAPTER: 'true'
    ports:
      - '4001:4001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:4001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ws:
        condition: service_started
    ports:
      - '5173:8080'

volumes:
  postgres-data:
  redis-data:
