name: taskly

# Full Taskly stack — infra + every app container.
#
# Drives all env from a single root file. By default this is `.env.production`;
# point at staging with `docker compose --env-file .env.staging up` (or use the
# scripted form `npm run docker:up:staging`).
#
# Up:        npm run docker:up        # uses .env.production
# Up build:  npm run docker:up:build
# Down:      npm run docker:down
# Logs:      npm run docker:logs
#
# For "infra-only" development (run apps on the host), use docker-compose.infra.yml
# instead — see npm run docker:infra:up.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskly}
      POSTGRES_DB: ${POSTGRES_DB:-taskly}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-taskly} -d ${POSTGRES_DB:-taskly}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    entrypoint: []
    working_dir: /app/apps/api
    command:
      - /bin/sh
      - -c
      - npx prisma migrate deploy --schema=prisma/schema.prisma || npx prisma db push --schema=prisma/schema.prisma --accept-data-loss
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    ports:
      - '${API_PORT:-4000}:${API_PORT:-4000}'
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:${API_PORT:-4000}/healthz | grep -q '"ok":true' || exit 1
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production

  ws:
    build:
      context: .
      dockerfile: apps/ws/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env.production
    ports:
      - '${WS_PORT:-4001}:${WS_PORT:-4001}'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_WS_URL: ${VITE_WS_URL:-http://localhost:4001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ws:
        condition: service_started
    ports:
      - '5173:8080'

volumes:
  postgres-data:
  redis-data:
